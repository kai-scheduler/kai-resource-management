# Chart values for e2e runs, not shipped defaults.
#
# Only requests come down, none below 50m: a request is a share of a contended
# node, not a cap, so lower would starve the controllers the suites wait on.
# kai-scheduler's other services already request 50m or nothing.

krmOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

nodePoolController:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 900m, memory: 1Gi }

projectController:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 300m, memory: 2Gi }
  # Without a blocker configured, deletionType Blocking blocks on nothing. Secrets rather
  # than ConfigMaps: every namespace gets a kube-root-ca.crt ConfigMap, which would block
  # every project forever. The selector narrows it to secrets an e2e run created.
  deleteBlockers:
    - displayName: Secrets
      version: v1
      kind: Secret
      labelSelector:
        matchLabels:
          kai.resources/e2e: "true"

podGroupAssigner:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 512Mi }

kai-scheduler:
  scheduler:
    # One scheduler per node pool, so a suite creating several multiplies this.
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 700m, memory: 512Mi }
