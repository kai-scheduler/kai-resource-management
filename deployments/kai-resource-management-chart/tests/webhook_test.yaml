# Cert material is regenerated on every offline render (lookup returns nothing under
# helm template), so these assert shape rather than value. b64 of the PEM header stands in
# for "this is a certificate"; caBundle == ca.crt cannot be checked here because
# helm-unittest cannot compare across documents.
suite: admission webhooks and their TLS certs
templates:
  - templates/pod-group-assigner/webhook.yaml
  - templates/nodepool-controller/webhook.yaml
  - templates/nodepool-controller/deployment.yaml
  - templates/nodepool-controller/service.yaml
  - templates/project-controller/webhook.yaml
release:
  name: rm
  namespace: kai
set:
  image.registry: reg.example.com/kai
tests:
  - it: renders a TLS Secret per controller, minted by the chart
    asserts:
      - hasDocuments: {count: 3}
        template: templates/pod-group-assigner/webhook.yaml
      - equal: {path: type, value: kubernetes.io/tls}
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: pod-group-assigner-tls-secret}
      # ca.crt is stored alongside the key pair so the sticky-cert branch can restore it.
      - matchRegex:
          path: data["ca.crt"]
          pattern: ^LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: pod-group-assigner-tls-secret}
      - matchRegex:
          path: data["tls.key"]
          pattern: ^LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVkt
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: pod-group-assigner-tls-secret}
      - equal: {path: metadata.name, value: nodepool-controller-tls-secret}
        template: templates/nodepool-controller/webhook.yaml
        documentIndex: 0
      - equal: {path: metadata.name, value: project-controller-tls-secret}
        template: templates/project-controller/webhook.yaml
        documentIndex: 0

  # The Secret is the first document in each file, so it is the one that gets
  # concatenated onto the licence header if the include trims the newline before
  # it. That renders fine and passes every assertion on its content, but the API
  # server rejects the document for having no apiVersion, and the whole chart
  # fails to install.
  - it: starts each TLS Secret as its own document
    asserts:
      - isAPIVersion: {of: v1}
        template: templates/nodepool-controller/webhook.yaml
        documentIndex: 0
      - isKind: {of: Secret}
        template: templates/nodepool-controller/webhook.yaml
        documentIndex: 0
      - isAPIVersion: {of: v1}
        template: templates/project-controller/webhook.yaml
        documentIndex: 0
      - isKind: {of: Secret}
        template: templates/project-controller/webhook.yaml
        documentIndex: 0
      - isAPIVersion: {of: v1}
        template: templates/pod-group-assigner/webhook.yaml
        documentIndex: 0
      - isKind: {of: Secret}
        template: templates/pod-group-assigner/webhook.yaml
        documentIndex: 0

  - it: publishes a caBundle on every webhook off OpenShift
    asserts:
      - matchRegex:
          path: webhooks[0].clientConfig.caBundle
          pattern: ^LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-pod-group-mutation}
      - matchRegex:
          path: webhooks[0].clientConfig.caBundle
          pattern: ^LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}
      # Both entries of the project VWC come from one helper invocation, so both are set.
      - matchRegex:
          path: webhooks[1].clientConfig.caBundle
          pattern: ^LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}

  - it: routes each webhook to the path its binary serves
    # These paths are the contract with the controllers; nodepool's is generated by
    # controller-runtime from the GVK and cannot be chosen.
    asserts:
      - equal: {path: "webhooks[0].clientConfig.service.path", value: /mutate-pod-group}
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-pod-group-mutation}
      - equal: {path: "webhooks[0].clientConfig.service.path", value: /mutate-pod}
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-pod-mutation}
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /validate-kai-resources-v1alpha1-nodepool
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}
      - equal: {path: "webhooks[0].clientConfig.service.path", value: /validate-project}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
      - equal: {path: "webhooks[1].clientConfig.service.path", value: /validate-department}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}

  - it: validates Projects and Departments on create and update but never on delete
    # The handler decodes only request.object, which is empty on delete, so a DELETE rule
    # would reject every deletion. Deletion ordering is the finalizer's job.
    asserts:
      - equal: {path: "webhooks[0].rules[0].operations", value: ["CREATE", "UPDATE"]}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
      - equal: {path: "webhooks[1].rules[0].operations", value: ["CREATE", "UPDATE"]}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
      - equal: {path: "webhooks[0].rules[0].scope", value: Cluster}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}

  - it: validates NodePools on create only, cluster-scoped
    # ValidateUpdate and ValidateDelete are deliberate no-ops in the binary.
    asserts:
      - equal: {path: "webhooks[0].rules[0].operations", value: ["CREATE"]}
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}
      - equal: {path: "webhooks[0].rules[0].apiGroups", value: ["kai.resources"]}
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}
      - equal: {path: "webhooks[0].rules[0].scope", value: Cluster}
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}

  - it: mounts the cert as a required Secret and serves on the port the Service targets
    # Not optional: the chart creates the Secret, so a missing one is a real failure rather
    # than a webhook that silently never answers.
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=="webhook-certs")].secret.secretName
          value: nodepool-controller-tls-secret
        template: templates/nodepool-controller/deployment.yaml
      - contains: {path: "spec.template.spec.containers[0].args", content: "8443"}
        template: templates/nodepool-controller/deployment.yaml

  - it: passes each chart-deployed controller the flag that registers its handler
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-nodepool-validation-webhook=true
        template: templates/nodepool-controller/deployment.yaml
  - it: drops only its own webhook when a gate is turned off
    set:
      projectController.webhook.department: false
      podGroupAssigner.webhook.pod: false
    asserts:
      # The project entry survives and the department entry is gone, so index 1 is absent.
      - equal: {path: "webhooks[0].clientConfig.service.path", value: /validate-project}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
      - notExists: {path: "webhooks[1]"}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
      # Pod mutation gone; pod-group mutation and the Secret remain (2 documents, not 3).
      - hasDocuments: {count: 2}
        template: templates/pod-group-assigner/webhook.yaml

  - it: keeps pod-group-assigner's cert when every gate is off, because its server always runs
    # The binary registers /mutate-pod-group unconditionally, so it needs a serving cert even
    # with no webhook object routing to it.
    set:
      podGroupAssigner.webhook.pod: false
    asserts:
      - hasDocuments: {count: 2}
        template: templates/pod-group-assigner/webhook.yaml
  - it: removes the cert, port and mount when a controller's webhooks are all off
    set:
      nodePoolController.webhook.nodepool: false
      projectController.webhook.project: false
      projectController.webhook.department: false
    asserts:
      - hasDocuments: {count: 0}
        template: templates/nodepool-controller/webhook.yaml
      - hasDocuments: {count: 0}
        template: templates/project-controller/webhook.yaml
      - notExists: {path: spec.template.spec.volumes}
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-nodepool-validation-webhook=false
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.ports
          content: {name: webhook, protocol: TCP, port: 443, targetPort: 8443}
        template: templates/nodepool-controller/service.yaml

  - it: defers to the OpenShift service-CA instead of minting its own cert
    set:
      openshift: true
    asserts:
      # The platform mints the Secret, so the chart renders only the webhook objects.
      - hasDocuments: {count: 2}
        template: templates/pod-group-assigner/webhook.yaml
      - hasDocuments: {count: 1}
        template: templates/nodepool-controller/webhook.yaml
      - equal:
          path: metadata.annotations["service.beta.openshift.io/inject-cabundle"]
          value: "true"
        template: templates/nodepool-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-nodepool-validation}
      # caBundle must be absent, not empty - an empty value would fight the injector.
      - notExists: {path: "webhooks[0].clientConfig.caBundle"}
        template: templates/project-controller/webhook.yaml
        documentSelector: {path: metadata.name, value: kai-project-validation}
