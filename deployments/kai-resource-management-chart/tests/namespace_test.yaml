suite: install namespace is the single source of truth
templates:
  - templates/nodepool-controller/deployment.yaml
release:
  name: krm
  namespace: my-ns
tests:
  - it: nodepool-controller renders under the release namespace and omits vocabulary flags
    set:
      image.registry: reg.example.com/kai
    template: templates/nodepool-controller/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: my-ns
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --nodepool-label-key
