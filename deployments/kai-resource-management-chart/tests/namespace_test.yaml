suite: install namespace is the single source of truth
templates:
  - templates/krm-config.yaml
release:
  name: krm
  namespace: my-ns
set:
  image.registry: reg.example.com/kai
  krmConfigDeployer.enabled: false
  krmConfig.render: true
tests:
  # The operator deploys every service into this namespace and passes it on as
  # --scheduler-namespace; the chart hardcodes no namespace anywhere.
  - it: sends the operator the release namespace and no vocabulary it was not given
    asserts:
      - equal:
          path: spec.namespace
          value: my-ns
      - notExists:
          path: spec.global.nodePoolLabelKey
