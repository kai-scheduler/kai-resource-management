# FIPS has two halves that fail independently: the "-fips" image tag selects a
# binary built against the validated module, and GODEBUG=fips140 selects how
# strictly that binary uses it. Either one silently missing produces an install
# that reports FIPS and is not, so both are asserted for every mode.
suite: global.fipsMode image tags and GODEBUG
release:
  name: krm
  namespace: kai
tests:
  - it: defaults to off, leaving tags unsuffixed
    templates:
      - templates/krm-operator/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: -fips$
      # Emitted even when disabled: a FIPS-built image defaults to fips140=on, so
      # only an explicit "off" can turn it back off without changing the image.
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GODEBUG, value: fips140=off}

  - it: suffixes every component image when enabled
    set:
      global.fipsMode: "on"
    templates:
      - templates/krm-operator/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: :0\.0\.0-fips$
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GODEBUG, value: fips140=on}

  # The hook Jobs run a binary this repo builds, so both halves have to reach them
  # too: an install at "only" that left them at the image default would be strict
  # for the services and not for the Jobs.
  - it: gives the hook Jobs the -fips image and the matching GODEBUG
    set:
      global.fipsMode: only
    templates:
      - templates/hooks/pre/crd-upgrader.yaml
      - templates/hooks/post/krm-config-deployer/job.yaml
      - templates/hooks/post/krm-config-cleanup/job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: -fips$
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GODEBUG, value: "fips140=only,tlsmlkem=0"}

  - it: carries the mode to each service as GODEBUG
    set:
      global.fipsMode: only
    templates:
      - templates/krm-operator/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GODEBUG, value: "fips140=only,tlsmlkem=0"}

  # The operator builds its operands from MS_TAG, so the suffix has to survive
  # the trip: this is what makes project-controller a FIPS image too.
  - it: hands the operator a FIPS operand tag without losing its other env
    set:
      global.fipsMode: "on"
    templates:
      - templates/krm-operator/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MS_TAG, value: "0.0.0-fips"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MS_REPOSITORY, value: registry/local/kai-resource-management}

  - it: suffixes an explicitly pinned tag rather than replacing it
    set:
      global.fipsMode: "on"
      image.tag: "1.2.3"
      nodePoolController.image.tag: "4.5.6"
      krmConfigDeployer.enabled: false
      krmConfig.render: true
    templates:
      - templates/krm-config.yaml
    asserts:
      - equal:
          path: spec.nodePoolController.service.image.tag
          value: 4.5.6-fips

  - it: reaches the KRMConfig the deployer applies
    set:
      global.fipsMode: only
    templates:
      - templates/hooks/post/krm-config-deployer/configmap.yaml
    asserts:
      - matchRegex:
          path: data["krm-config.yaml"]
          pattern: 'fipsMode: "only"'

  # Off is the CR's own default, so emitting it would defeat the "the CR shows
  # only what was set" contract that krm_config_deployer_test.yaml pins.
  - it: omits fipsMode from the KRMConfig when disabled
    templates:
      - templates/hooks/post/krm-config-deployer/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["krm-config.yaml"]
          pattern: fipsMode

  # A typo that renders successfully is the worst outcome available here: the
  # install looks FIPS-enabled and every image is the ordinary one.
  # Helm aborts at the first template to force the helper and attributes the
  # error there, so this names the deployer Job rather than the template whose
  # behaviour is under test. If a new template sorts ahead of it this test fails
  # rather than silently stops checking - retarget it then.
  - it: refuses an unrecognised mode
    set:
      global.fipsMode: "Only"
    templates:
      - templates/hooks/post/krm-config-deployer/job.yaml
    asserts:
      - failedTemplate:
          errorPattern: "must be one of: off, on, only"

  # Nothing but the shared global.fipsMode puts the bundled scheduler on FIPS
  # images, so a KAI release that renames the key would silently split the install.
  - it: puts the bundled scheduler on FIPS images from global.fipsMode alone
    set:
      global.fipsMode: "on"
    templates:
      - charts/kai-scheduler/templates/services/operator.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: -fips$
