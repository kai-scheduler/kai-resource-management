# Only the vocabulary that still renders into a template is asserted here. Every
# service is operator-installed, so the rest is covered by each service's
# krm_config_*_test.yaml, shared_args_test.yaml, and the operands' Go tests.
suite: controller args exposed as chart values
templates:
  - templates/krm-config.yaml
  - templates/pod-group-assigner/webhook.yaml
release:
  name: rm
  namespace: kai
set:
  image.registry: reg.example.com/kai
  krmConfigDeployer.enabled: false
  krmConfig.render: true
tests:
  - it: the webhook namespaceSelector defaults to the controllers' namespace-project label
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: kai/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-group-mutation
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: kai/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-mutation

  - it: commonArgs.namespaceProjectLabelKey moves the selector and the flag together
    # The selector must name the label project-controller actually writes on project
    # namespaces. If it lagged behind an override the webhooks would simply never match -
    # silently, since a selector miss produces no admission error. This is the one place
    # the two ends are asserted together: the selector renders here, the flag on the CR.
    set:
      commonArgs.namespaceProjectLabelKey: acme/project
    asserts:
      - equal:
          path: spec.global.namespaceProjectLabelKey
          value: acme/project
        template: templates/krm-config.yaml
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: acme/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-group-mutation
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: acme/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-mutation
