suite: controller args exposed as chart values
templates:
  - templates/nodepool-controller/deployment.yaml
  - templates/pod-group-assigner/deployment.yaml
  - templates/pod-group-assigner/webhook.yaml
release:
  name: rm
  namespace: kai
set:
  image.registry: reg.example.com/kai
tests:
  - it: kai-scheduler.global.nodePoolLabelKey cascades --nodepool-label-key to all three controllers
    set:
      kai-scheduler.global.nodePoolLabelKey: custom/np
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --nodepool-label-key
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: custom/np
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --nodepool-label-key
        template: templates/pod-group-assigner/deployment.yaml

  - it: kai-scheduler.podgrouper.queueLabelKey cascades --queue-label-key to project + pod-group-assigner, not nodepool
    set:
      kai-scheduler.podgrouper.queueLabelKey: custom/queue
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --queue-label-key
        template: templates/pod-group-assigner/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --queue-label-key
        template: templates/nodepool-controller/deployment.yaml

  - it: the webhook namespaceSelector defaults to the controllers' namespace-project label
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: kai/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-group-mutation
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: kai/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-mutation

  - it: commonArgs.namespaceProjectLabelKey moves the selector and the flag together
    # The selector must name the label project-controller actually writes on project
    # namespaces. If it lagged behind an override the webhooks would simply never match -
    # silently, since a selector miss produces no admission error.
    set:
      commonArgs.namespaceProjectLabelKey: acme/project
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: acme/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-group-mutation
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: acme/project
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-mutation
      - contains:
          path: spec.template.spec.containers[0].args
          content: acme/project
        template: templates/pod-group-assigner/deployment.yaml
  - it: podGroupAssigner.args.namespaceProjectLabelKey overrides commonArgs for both
    # Precedence has to match the Deployment's, or the selector and the flag disagree.
    set:
      commonArgs.namespaceProjectLabelKey: acme/project
      podGroupAssigner.args.namespaceProjectLabelKey: comp/wins
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: comp/wins
        template: templates/pod-group-assigner/webhook.yaml
        documentSelector:
          path: metadata.name
          value: kai-pod-group-mutation
      - contains:
          path: spec.template.spec.containers[0].args
          content: comp/wins
        template: templates/pod-group-assigner/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: acme/project
        template: templates/pod-group-assigner/deployment.yaml

  - it: commonArgs.schedulerName reaches nodepool-controller and pod-group-assigner, not project-controller
    # Both binaries must target the same scheduler: nodepool-controller stamps it on
    # SchedulingShards, pod-group-assigner writes it on pods when enforcement applies.
    set:
      commonArgs.schedulerName: my-scheduler
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scheduler-name
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: my-scheduler
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scheduler-name
        template: templates/pod-group-assigner/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: my-scheduler
        template: templates/pod-group-assigner/deployment.yaml
      # project-controller's binary has no such flag
  - it: nodepoolController.args.schedulerName overrides the shared value
    set:
      commonArgs.schedulerName: my-scheduler
      nodepoolController.args.schedulerName: np-override
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: np-override
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: my-scheduler
        template: templates/nodepool-controller/deployment.yaml
      # the shared value still reaches the controller that did not override it
      - contains:
          path: spec.template.spec.containers[0].args
          content: my-scheduler
        template: templates/pod-group-assigner/deployment.yaml

  - it: nodepool-controller pins --scheduler-namespace to the release namespace
    template: templates/nodepool-controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scheduler-namespace
      - contains:
          path: spec.template.spec.containers[0].args
          content: kai

  - it: per-controller args.leaderElect true overrides a global-off default
    set:
      podGroupAssigner.args.leaderElect: true
    template: templates/pod-group-assigner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: global.leaderElection true renders --leader-elect on all three controllers
    set:
      global.leaderElection: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
        template: templates/pod-group-assigner/deployment.yaml

  - it: explicit args.leaderElect false overrides a global-on setting (issue 1 regression)
    set:
      global.leaderElection: true
      nodepoolController.args.leaderElect: false
      projectController.args.leaderElect: false
      podGroupAssigner.args.leaderElect: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
        template: templates/pod-group-assigner/deployment.yaml

  - it: nodepool-controller metrics.namespace / schedulingShardArgs / excludedNodepoolName render
    set:
      nodepoolController.metrics.namespace: kai
      nodepoolController.args.schedulingShardArgs: '{"v":"2"}'
      nodepoolController.args.excludedNodepoolName: kai-excluded
    template: templates/nodepool-controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-namespace
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scheduling-shard-args
      - contains:
          path: spec.template.spec.containers[0].args
          content: --excluded-nodepool-name

  - it: pod-group-assigner args.unexistingNodepoolSentinel renders
    set:
      podGroupAssigner.args.unexistingNodepoolSentinel: kai-unexisting-node-pool
    template: templates/pod-group-assigner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --unexisting-nodepool-sentinel

  - it: arbitrary <comp>.args keys cascade generically as camelCase -> --kebab-case flags
    # Proves any go-operator flag is settable from values without a template edit — required
    # for using this chart as a subchart of a parent that drives the full arg surface.
    set:
      nodepoolController.args.finalizerDomain: example.org
      nodepoolController.args.toExcludeLabel: acme/exclude
      projectController.args.projectLabelKey: acme/project
      projectController.args.namespaceProjectLabelKey: acme/queue
      podGroupAssigner.args.annotationNodepoolsKey: acme/nps
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --finalizer-domain
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --to-exclude-label
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --annotation-nodepools-key
        template: templates/pod-group-assigner/deployment.yaml

  - it: defaultNodePool.name is the single source for --default-nodepool-name on all three controllers
    set:
      defaultNodePool.name: my-default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --default-nodepool-name
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: my-default
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: my-default
        template: templates/pod-group-assigner/deployment.yaml

  - it: commonArgs apply only to controllers whose binary defines the flag, per-controller overrides win
    set:
      commonArgs.finalizerDomain: acme.io
      commonArgs.projectLabelKey: acme/project
      projectController.args.finalizerDomain: proj-override
    asserts:
      # finalizer-domain: nodepool + project, NOT pod-group-assigner
      - contains:
          path: spec.template.spec.containers[0].args
          content: --finalizer-domain
        template: templates/nodepool-controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: acme.io
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --finalizer-domain
        template: templates/pod-group-assigner/deployment.yaml
      # per-controller override wins over the shared value
      - contains:
          path: spec.template.spec.containers[0].args
          content: --project-label-key
        template: templates/pod-group-assigner/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --project-label-key
        template: templates/nodepool-controller/deployment.yaml

  - it: vocabulary/operational flags are omitted by default (render-when-set)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --nodepool-label-key
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --scheduler-name
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --qps
        template: templates/nodepool-controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --namespace-project-label-key
        template: templates/pod-group-assigner/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enforce-scheduler-annotation-key
        template: templates/pod-group-assigner/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --scheduler-name
        template: templates/pod-group-assigner/deployment.yaml

  - it: commonArgs.enforceSchedulerAnnotationKey reaches both sides of the enforcement contract
    # project-controller writes the annotation, pod-group-assigner reads it back; a single
    # shared value keeps the two keys from drifting apart.
    set:
      commonArgs.enforceSchedulerAnnotationKey: acme/enforce-scheduler-name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enforce-scheduler-annotation-key
        template: templates/pod-group-assigner/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: acme/enforce-scheduler-name
        template: templates/pod-group-assigner/deployment.yaml
      # nodepool-controller's binary has no such flag
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enforce-scheduler-annotation-key
        template: templates/nodepool-controller/deployment.yaml

  - it: podGroupAssigner.args.schedulerName renders --scheduler-name, per-controller override wins
    set:
      commonArgs.enforceSchedulerAnnotationKey: acme/enforce-scheduler-name
      podGroupAssigner.args.enforceSchedulerAnnotationKey: pga-override
    template: templates/pod-group-assigner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: pga-override
      - notContains:
          path: spec.template.spec.containers[0].args
          content: acme/enforce-scheduler-name
