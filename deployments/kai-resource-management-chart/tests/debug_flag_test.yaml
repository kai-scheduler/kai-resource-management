# Every service is installed by the operator, so debug reaches each binary through
# the KRMConfig. One key name across all three: the flag is --debug everywhere.
suite: unified --debug flag
templates:
  - templates/krm-config.yaml
release:
  name: krm
  namespace: kai-resource-management
set:
  krmConfigDeployer.enabled: false
  krmConfig.render: true
tests:
  - it: carries debug for every service under the same key
    set:
      nodePoolController.args.debug: true
      projectController.args.debug: true
      podGroupAssigner.args.debug: true
    asserts:
      - equal: {path: spec.nodePoolController.args.debug, value: true}
      - equal: {path: spec.projectController.args.debug, value: true}
      - equal: {path: spec.podGroupAssigner.args.debug, value: true}

  # False is emitted rather than omitted: values.yaml sets it, so the CR is explicit.
  - it: carries an explicit false by default
    asserts:
      - equal: {path: spec.nodePoolController.args.debug, value: false}
      - equal: {path: spec.projectController.args.debug, value: false}
      - equal: {path: spec.podGroupAssigner.args.debug, value: false}
