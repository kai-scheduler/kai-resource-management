suite: unified --debug flag
templates:
  - templates/nodepool-controller/deployment.yaml
  - templates/pod-group-assigner/deployment.yaml
release:
  name: krm
  namespace: kai-resource-management
tests:
  - it: emits --debug, never --log-level, when args.debug is true
    set:
      nodepoolController.args.debug: true
      podGroupAssigner.args.debug: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --debug
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --log-level

  - it: emits no debug flag by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --debug
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --log-level
