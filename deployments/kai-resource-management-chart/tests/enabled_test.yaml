suite: component enable/disable toggles
templates:
  - templates/nodepool-controller/deployment.yaml
  - templates/krm-operator/deployment.yaml
release:
  name: rm
  namespace: kai
tests:
  - it: renders the operator by default
    set:
      image.registry: reg.example.com/kai
    asserts:
      - hasDocuments:
          count: 1
        template: templates/krm-operator/deployment.yaml

  - it: renders the chart-deployed controllers by default
    set:
      image.registry: reg.example.com/kai
    asserts:
      - hasDocuments:
          count: 1
        template: templates/nodepool-controller/deployment.yaml
  - it: omits nodepool-controller when disabled
    set:
      image.registry: reg.example.com/kai
      nodePoolController.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/nodepool-controller/deployment.yaml

  - it: omits the operator when disabled
    set:
      image.registry: reg.example.com/kai
      krmOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/krm-operator/deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/nodepool-controller/deployment.yaml
