suite: component enable/disable toggles
templates:
  - templates/krm-config.yaml
  - templates/krm-operator/deployment.yaml
release:
  name: rm
  namespace: kai
set:
  image.registry: reg.example.com/kai
  krmConfigDeployer.enabled: false
  krmConfig.render: true
tests:
  - it: renders the operator by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/krm-operator/deployment.yaml

  # The operator installs all three, so the toggles reach it through the CR rather
  # than deciding whether this chart renders a Deployment.
  - it: enables every service by default
    asserts:
      - equal: {path: spec.nodePoolController.service.enabled, value: true}
        template: templates/krm-config.yaml
      - equal: {path: spec.projectController.service.enabled, value: true}
        template: templates/krm-config.yaml
      - equal: {path: spec.podGroupAssigner.service.enabled, value: true}
        template: templates/krm-config.yaml

  - it: disables nodepool-controller without touching the others
    set:
      nodePoolController.enabled: false
    asserts:
      - equal: {path: spec.nodePoolController.service.enabled, value: false}
        template: templates/krm-config.yaml
      - equal: {path: spec.projectController.service.enabled, value: true}
        template: templates/krm-config.yaml

  # Nothing reconciles the CR then, but the CR is still rendered: it is the record
  # of what was asked for, and the operator picks it up when it comes back.
  - it: omits the operator when disabled
    set:
      krmOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/krm-operator/deployment.yaml
      - equal: {path: spec.nodePoolController.service.enabled, value: true}
        template: templates/krm-config.yaml
