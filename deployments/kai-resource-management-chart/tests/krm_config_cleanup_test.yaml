suite: post-delete cleanup hook
templates:
  - templates/hooks/post/krm-config-cleanup/job.yaml
  - templates/hooks/post/krm-config-cleanup/rbac.yaml
release:
  name: krm
  namespace: kai
set:
  image.registry: reg.example.com/kai
tests:
  - it: renders by default
    asserts:
      - hasDocuments: {count: 1}
        template: templates/hooks/post/krm-config-cleanup/job.yaml
      # SA + Role + RoleBinding + ClusterRole + ClusterRoleBinding
      - hasDocuments: {count: 5}
        template: templates/hooks/post/krm-config-cleanup/rbac.yaml

  - it: renders nothing when disabled
    set:
      postCleanup.enabled: false
    asserts:
      - hasDocuments: {count: 0}
        template: templates/hooks/post/krm-config-cleanup/job.yaml
      - hasDocuments: {count: 0}
        template: templates/hooks/post/krm-config-cleanup/rbac.yaml

  # Without the argocd pair, ArgoCD treats Helm hooks as ordinary sync-phase
  # resources and the cleanup never runs on delete (needs ArgoCD >= 2.10).
  - it: runs after the release is deleted, in Helm and in ArgoCD
    template: templates/hooks/post/krm-config-cleanup/job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-delete
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostDelete
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded

  # Scoping to the release namespace is the chart's half of the contract; selecting
  # only what the operator labelled is the binary's, covered in pkg/helmhooks.
  - it: removes the operand deployments and then the CR
    template: templates/hooks/post/krm-config-cleanup/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: cleanup
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespace=kai
      - contains:
          path: spec.template.spec.containers[0].args
          content: --delete-config=krm-config
      - notExists:
          path: spec.template.spec.containers[0].command

  # In render mode the CR is a tracked release resource Helm deletes itself; with
  # both modes off it belongs to somebody else. Either way the chart must not.
  - it: deletes the CR only when this chart created it
    set:
      krmConfigDeployer.enabled: false
    template: templates/hooks/post/krm-config-cleanup/job.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --delete-config=krm-config
      # The operand deployments still have to go: the operator created them, not Helm.
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespace=kai

  # The only place in this chart granting delete on a krmconfig, and only on the one
  # the chart created. The get is what lets the hook wait for the deletion to finish.
  - it: is the only holder of delete on krmconfigs
    template: templates/hooks/post/krm-config-cleanup/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kai.resources"]
            resources: ["krmconfigs"]
            resourceNames: ["krm-config"]
            verbs: ["delete", "get"]

  # Deployments are namespaced and only ever deleted in the release namespace, so the
  # grant is namespaced too. A ClusterRole here would let a compromised hook token
  # delete Deployments anywhere in the cluster.
  - it: can delete deployments only in the release namespace
    template: templates/hooks/post/krm-config-cleanup/rbac.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: kai
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["delete", "get", "list", "watch"]

  - it: grants nothing cluster-wide on deployments
    template: templates/hooks/post/krm-config-cleanup/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["delete", "get", "list", "watch"]

  - it: never restarts, so a failed cleanup does not loop
    template: templates/hooks/post/krm-config-cleanup/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
