suite: SchedulingShard migration hook
templates:
  - templates/hooks/pre/migrate-shards/job.yaml
  - templates/hooks/pre/migrate-shards/rbac.yaml
release:
  name: rm
  namespace: kai
tests:
  # Unset is today's default, and means the subchart is bundled.
  - it: renders nothing while kai-scheduler.enabled is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing while kai-scheduler.enabled is true
    set:
      kai-scheduler.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: runs after the CRD upgrader beside an existing KAI Scheduler
    template: templates/hooks/pre/migrate-shards/job.yaml
    set:
      kai-scheduler.enabled: false
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "3"
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - migrate-shards
            - --default-nodepool-name=default
            - --ensure-default-nodepool
            - --default-nodepool-spec={}
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry/local/kai-resource-management/helm-hooks:0.0.0
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  # The same values the nodepool-controller reads, so a migrated shard matches what it writes.
  - it: passes the nodepool-controller's label key, default name and shard args
    template: templates/hooks/pre/migrate-shards/job.yaml
    set:
      kai-scheduler.enabled: false
      kai-scheduler.global.nodePoolLabelKey: example.com/pool
      defaultNodePool.name: catch-all
      nodePoolController.args.schedulingShardArgs: '{"verbosity":"4"}'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - migrate-shards
            - --nodepool-label-key=example.com/pool
            - --default-nodepool-name=catch-all
            - --scheduling-shard-args={"verbosity":"4"}
            - --ensure-default-nodepool
            - --default-nodepool-spec={}

  - it: creates the default NodePool beside an existing KAI Scheduler, from the chart's spec
    template: templates/hooks/pre/migrate-shards/job.yaml
    set:
      kai-scheduler.enabled: false
      defaultNodePool.spec:
        schedulingShardConfig:
          queueDepthPerAction:
            allocate: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - migrate-shards
            - --default-nodepool-name=default
            - --ensure-default-nodepool
            - '--default-nodepool-spec={"schedulingShardConfig":{"queueDepthPerAction":{"allocate":10}}}'

  - it: creates no default NodePool when it is disabled
    template: templates/hooks/pre/migrate-shards/job.yaml
    set:
      kai-scheduler.enabled: false
      defaultNodePool.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --ensure-default-nodepool

  - it: grants its ServiceAccount only what the migration reads and writes, before the Job
    template: templates/hooks/pre/migrate-shards/rbac.yaml
    set:
      kai-scheduler.enabled: false
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - equal:
          path: rules
          value:
            - apiGroups: ["kai.scheduler"]
              resources: ["schedulingshards"]
              verbs: ["get", "list", "patch"]
            - apiGroups: ["kai.resources"]
              resources: ["nodepools"]
              verbs: ["get", "create", "patch"]
            - apiGroups: ["kai.resources"]
              resources: ["nodepools/finalizers"]
              verbs: ["update"]
            - apiGroups: ["kai.scheduler"]
              resources: ["configs"]
              resourceNames: ["kai-config"]
              verbs: ["get"]
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: kai-resource-management-migrate-shards
              namespace: kai
        documentIndex: 2
