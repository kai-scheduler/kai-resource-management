# The operator builds the ServiceMonitors, so these chart values reach it through
# the KRMConfig. That the nodepool-controller gets two monitors on one endpoint,
# and which of them carries the accounting label, is asserted in the operand's own
# Go tests.
suite: serviceMonitor values reach the KRMConfig
templates:
  - templates/krm-config.yaml
release:
  name: rm
  namespace: kai
set:
  krmConfigDeployer.enabled: false
  krmConfig.render: true
tests:
  # Both are on by default, and the CR says nothing: an emitted value would take
  # ownership of the field under server-side apply and defeat the operator's default.
  - it: says nothing while both monitors are wanted
    asserts:
      - notExists:
          path: spec.global.serviceMonitor

  - it: turns every monitor off
    set:
      serviceMonitor.create: false
    asserts:
      - equal:
          path: spec.global.serviceMonitor.enabled
          value: false

  - it: turns off only the accounting monitor
    set:
      serviceMonitor.accounting: false
    asserts:
      - equal:
          path: spec.global.serviceMonitor.accounting
          value: false
      - notExists:
          path: spec.global.serviceMonitor.enabled
