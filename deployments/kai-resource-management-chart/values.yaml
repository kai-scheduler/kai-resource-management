# KAI Resource Management chart — user-facing values.
#
# This file is intentionally slim. Static defaults (ports, resource requests/limits,
# replica counts, metrics port names) live in the templates via `| default`, and the
# controllers' own label/vocabulary defaults are used by omitting those flags entirely.
# Override anything by adding the corresponding key.
# See internal_values.yaml for a catalog of the hidden knobs.
#
# The install namespace is the single source of truth: `.Release.Namespace`
# (e.g. `helm install krm . -n kai-resource-management`). The chart hardcodes no namespace.

# Registry/tag for THIS chart's component images. Kept OUT of `global` on purpose: Helm shares
# `global.*` into subcharts, so a global registry/tag would override kai-scheduler's own ghcr images.
image:
  # Registry for all components (per-component <comp>.image.registry overrides it).
  # Defaults to the local registry the Makefile builds into; release packaging
  # rewrites it to the published registry.
  registry: registry/local/kai-resource-management
  # Tag for all components. Empty -> the chart appVersion (per-component <comp>.image.tag overrides).
  tag: ""

global:
  # Pull policy for all components (per-component image.pullPolicy overrides; default IfNotPresent).
  imagePullPolicy: IfNotPresent
  # List of {name: <secret>} image pull secrets added to every pod.
  imagePullSecrets: []
  # Select the FIPS image variants (appends "-fips" to every image tag).
  fips: false
  # Emit `--leader-elect` on every component (also implied when a component has >1 replica).
  leaderElection: false
  # Container security context. Defaults to runAsUser 10000, matching the uid the OpenShift
  # SCC pins. There is deliberately no pod-level context: no volume needs an fsGroup.
  securityContext: {}
  # Pod scheduling, applied to every component.
  affinity: {}
  tolerations: []
  nodeSelector: {}

# Force OpenShift mode: creates the SecurityContextConstraints and its use grant (subject to
# rbac.create). When false it is auto-detected via a cluster lookup; set true explicitly for
# offline rendering (helm template / ArgoCD).
openshift: false

# Create the ClusterRoles / Roles / bindings the components need.
rbac:
  create: true

serviceMonitor:
  # Create Prometheus ServiceMonitors for the components that expose metrics
  # (nodepool-controller, project-controller; pod-group-assigner does not expose metrics).
  create: true
  # Additionally create the nodepool-controller "accounting" ServiceMonitor (labeled
  # kai.scheduler/accounting=true) so the node->nodepool metrics reach the KAI accounting
  # Prometheus. Harmless without it; required if the KAI accounting Prometheus is deployed.
  accounting: true

# KAI-scheduler subchart (oci://ghcr.io/kai-scheduler/kai-scheduler), always bundled — the controllers
# depend on its scheduler + CRDs. Parent global.* (fips, imagePullSecrets, securityContext, scheduling)
# is shared with the subchart automatically by Helm; KAI-specific overrides are set here. (Our
# registry/tag live under the top-level `image:` block, NOT global, so they don't clobber KAI's images.)
kai-scheduler:
  global:
    # Pin KAI to its own published images regardless of the parent global.registry.
    registry: ghcr.io/kai-scheduler/kai-scheduler
    # Shared node-pool label key. One source: KAI's kai-config and all three controllers read it.
    # Empty ⇒ the scheduler and controllers use their built-in default.
    nodePoolLabelKey: ""
  podgrouper:
    # Shared queue label key (sibling of global.nodePoolLabelKey), read by KAI's kai-config,
    # project-controller and pod-group-assigner. Empty ⇒ built-in default.
    queueLabelKey: ""
  # KAI owns its Config CR via the built-in deployer hook (no operator in this chart).
  # For GitOps/ArgoCD instead set kaiConfigDeployer.enabled=false and kaiConfig.render=true.
  kaiConfigDeployer:
    enabled: true
  kaiConfig:
    render: false
  # Our controllers own these: nodepool-controller creates SchedulingShards, project-controller Queues.
  defaultShard:
    enabled: false
  defaultQueue:
    createDefaultQueue: false

# Chart-managed default catch-all NodePool (replaces KAI's disabled default shard/queue).
# Enabled by default; set enabled=false to opt out. spec is a passthrough (empty = catch-all).
# `name` is the single source of truth for the default nodepool: it names the NodePool CR and
# is passed to every controller as --default-nodepool-name.
defaultNodePool:
  enabled: true
  name: default
  spec: {}

# Args shared by more than one controller (set once; per-controller <comp>.args overrides).
# Each is applied only to controllers whose binary accepts it. Empty ⇒ binary default.
# See internal_values.yaml for which controllers use each.
commonArgs:
  finalizerDomain: ""               # --finalizer-domain
  namespaceProjectLabelKey: ""      # --namespace-project-label-key
  projectLabelKey: ""               # --project-label-key
  enforceSchedulerAnnotationKey: "" # --enforce-scheduler-annotation-key
  schedulerName: ""                 # --scheduler-name; empty ⇒ the bundled scheduler

# KRM operator. Reconciles the cluster-scoped, singleton KRMConfig and deploys the
# services described by it. It currently deploys nothing: the three controllers are
# installed by their own templates below until they become operands.
krmOperator:
  enabled: true
  image:
    name: krm-operator
    # registry / tag / pullPolicy fall back to the top-level image block and global.
  # replicas / resources / metricsPort / probePort: see internal_values.yaml
  args: {}

# The KRMConfig CR the operator reconciles. By default a post-install/post-upgrade
# hook Job applies it with `kubectl apply --server-side`, so it is NOT a Helm release
# resource: its UID survives every upgrade, which matters because the operator hangs
# ownerReferences off it. Disable the deployer to manage the CR yourself — that is
# what Run:ai does when it installs this chart and creates the KRMConfig itself.
krmConfig:
  # Render the CR inline as an ordinary release resource instead, so GitOps tools
  # track, drift-detect and self-heal it. Mutually exclusive with the deployer below.
  render: false

krmConfigDeployer:
  enabled: true
  image:
    name: helm-hooks
    # registry / tag / pullPolicy fall back to the top-level image block and global.

# Post-delete hook: removes the operator-managed deployments and, when this chart
# created it, the KRMConfig.
postCleanup:
  enabled: true
  image:
    name: helm-hooks
    # registry / tag / pullPolicy fall back to the top-level image block and global.

crdUpgrader:
  image:
    name: helm-hooks
    # registry / tag / pullPolicy fall back to the top-level image block and global.

nodepoolController:
  enabled: true
  image:
    name: nodepool-controller
    # registry / tag / pullPolicy fall back to global.
  # replicas: 1
  # resources: { limits: {cpu, memory}, requests: {cpu, memory} }  # defaults in template
  args:
    debug: false
  # Namespace of the DCGM exporter Service. Omitted by default so the binary's own default
  # applies; set to override.
  # dcgmExporterNamespace: ""
  webhook:
    # Validate NodePools on create: reject a missing or duplicate label key/value pair.
    nodepool: true

projectController:
  enabled: true
  image:
    name: project-controller
  # replicas / resources: defaults in template
  args:
    debug: false
    projectNamePrefix: ""   # --project-name-prefix; prefix for managed project namespaces (default "kai")
  profiling:
    enabled: false
  # Feature flags controlling which per-project resources / RoleBindings the controller manages.
  # Each flag also gates the matching ClusterRole/RoleBinding and rolebindings-plugin entry.
  features:
    createNamespaces: true
    createRoleBindings: true
    clusterWideSecret: true
    clusterWideConfigMap: true
    clusterWidePvc: true
    limitRange: false
  # Extra per-project RoleBindings to add to the rolebindings-plugin ConfigMap, as a map of
  # <key>: <RoleBinding YAML>. Use this to wire RoleBindings for components from other charts.
  extraProjectRoleBindings: {}
  # Validate on create and update: the parent department and any referenced node pools must
  # exist, and no two queues may claim the same node pool.
  webhook:
    project: true
    department: true

podGroupAssigner:
  enabled: true
  image:
    name: pod-group-assigner
  # replicas / resources: defaults in template
  args:
    debug: false
  # PodGroup mutation is always on and has no value; only Pod mutation is optional.
  webhook:
    # Mutate Pods on create in project namespaces: enforce the scheduler name, label the pod
    # with its project, and apply the project's default node pools as node affinity.
    pod: true
