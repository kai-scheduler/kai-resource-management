{{- if .Values.postCleanup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krm-config-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
---
# Deployments are namespaced and the Job only ever deletes them in the release
# namespace, so this is a Role rather than a ClusterRole: a cluster-wide grant would
# let a compromised hook token delete Deployments anywhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kai-resource-management-config-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kai-resource-management-config-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kai-resource-management-config-cleanup
subjects:
  - kind: ServiceAccount
    name: krm-config-cleanup
    namespace: {{ .Release.Namespace }}
---
# Only the cluster-scoped kinds need a ClusterRole. This is the one place in the
# chart granting delete on a krmconfig. The get is what lets the hook wait for the
# deletion to complete rather than only requesting it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-resource-management-config-cleanup
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
rules:
  - apiGroups: ["kai.resources"]
    resources: ["krmconfigs"]
    resourceNames: ["krm-config"]
    verbs: ["delete", "get"]
  {{- if not (dig "enabled" true (index .Values "kai-scheduler")) }}
  # Shards are released and NodePool finalizers stripped by patch alone; no get,
  # update or delete, so the hook cannot remove either.
  - apiGroups: ["kai.scheduler"]
    resources: ["schedulingshards"]
    verbs: ["list", "patch"]
  - apiGroups: ["kai.resources"]
    resources: ["nodepools"]
    verbs: ["list", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-resource-management-config-cleanup
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-resource-management-config-cleanup
subjects:
  - kind: ServiceAccount
    name: krm-config-cleanup
    namespace: {{ .Release.Namespace }}
{{- end }}
