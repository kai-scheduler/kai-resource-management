{{- if .Values.postCleanup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krm-config-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
---
# The only place in this chart granting delete on a krmconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-resource-management-config-cleanup
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["delete", "get", "list", "watch"]
  - apiGroups: ["kai.resources"]
    resources: ["krmconfigs"]
    verbs: ["delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["krmconfigs.kai.resources"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-resource-management-config-cleanup
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-resource-management-config-cleanup
subjects:
  - kind: ServiceAccount
    name: krm-config-cleanup
    namespace: {{ .Release.Namespace }}
{{- end }}
