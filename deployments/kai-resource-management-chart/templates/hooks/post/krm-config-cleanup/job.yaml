{{- if .Values.postCleanup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: krm-config-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "kai-resource-management.post-delete-hook-annotations" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        app: krm-config-cleanup
    spec:
      serviceAccountName: krm-config-cleanup
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ include "kai-resource-management.image" (dict "root" $ "image" .Values.postCleanup.image) }}
          imagePullPolicy: {{ include "kai-resource-management.imagePullPolicy" (dict "root" $ "image" .Values.postCleanup.image) }}
          resources:
            {{- toYaml (.Values.postCleanup.resources | default (dict "limits" (dict "cpu" "500m" "memory" "256Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | nindent 12 }}
          {{- include "kai-resource-management.securityContext" . | nindent 10 }}
          args:
            - cleanup
            - --namespace={{ .Release.Namespace }}
            {{- if .Values.krmConfigDeployer.enabled }}
            # Only when this chart created it. In render mode the CR is a release
            # resource Helm deletes before this hook runs; when both modes are off
            # the CR belongs to somebody else.
            - --delete-config=krm-config
            {{- end }}
          env:
            {{- include "kai-resource-management.godebug" . | nindent 12 }}
      {{- include "kai-resource-management.podScheduling" . | nindent 6 }}
{{- end }}
