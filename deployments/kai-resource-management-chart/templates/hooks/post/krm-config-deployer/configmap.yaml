{{- if .Values.krmConfigDeployer.enabled }}
# The Job applies the CR with `kubectl apply -f`, so the manifest has to reach the
# pod as a file. This ConfigMap is what the Job mounts it from. Rendering it here
# rather than inlining it into the Job's args keeps a large multi-line YAML out of
# the pod spec, where it would have to survive shell quoting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: krm-config-manifest
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
data:
  krm-config.yaml: |
    {{- include "kai-resource-management.krm-config" . | nindent 4 }}
{{- end }}
