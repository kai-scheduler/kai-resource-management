apiVersion: batch/v1
kind: Job
metadata:
  name: kai-resource-management-crd-upgrader
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: kai-resource-management-crd-upgrader
    spec:
      serviceAccountName: kai-resource-management-crd-manager
      containers:
      - name: upgrader
        image: {{ include "kai-resource-management.image" (dict "root" $ "image" .Values.crdUpgrader.image) }}
        imagePullPolicy: {{ include "kai-resource-management.imagePullPolicy" (dict "root" $ "image" .Values.crdUpgrader.image) }}
        args: ["apply-crds"]
        resources:
          {{- toYaml (.Values.crdUpgrader.resources | default (dict "limits" (dict "cpu" "500m" "memory" "256Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | nindent 10 }}
        {{- include "kai-resource-management.securityContext" . | nindent 8 }}
      restartPolicy: OnFailure
      {{- include "kai-resource-management.podScheduling" . | nindent 6 }}
