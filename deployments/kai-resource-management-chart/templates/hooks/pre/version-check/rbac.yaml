# Only beside an existing KAI Scheduler; unset means bundled, whose version is this chart's own.
{{- if not (dig "enabled" true (index .Values "kai-scheduler")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kai-resource-management-version-check
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-resource-management-version-check
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
# kai-config names the namespace of the kai-operator, whose image tag is KAI's version.
- apiGroups: ["kai.scheduler"]
  resources: ["configs"]
  resourceNames: ["kai-config"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["kai-operator"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-resource-management-version-check
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-resource-management-version-check
subjects:
  - kind: ServiceAccount
    name: kai-resource-management-version-check
    namespace: {{ .Release.Namespace }}
{{- end }}
