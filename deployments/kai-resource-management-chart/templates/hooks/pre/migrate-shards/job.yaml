{{- if include "kai-resource-management.usesExistingKaiScheduler" . }}
{{- $kaiSchedulerSettings := include "kai-resource-management.kaiSchedulerSettings" . | fromYaml }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-resource-management-migrate-shards
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: kai-resource-management-migrate-shards
    spec:
      serviceAccountName: kai-resource-management-migrate-shards
      containers:
      - name: migrate-shards
        image: {{ include "kai-resource-management.image" (dict "root" $ "image" .Values.migrateShards.image) }}
        imagePullPolicy: {{ include "kai-resource-management.imagePullPolicy" (dict "root" $ "image" .Values.migrateShards.image) }}
        # The same settings the nodepool-controller gets, so a migrated shard matches what
        # it will write.
        args:
          - migrate-shards
          {{- with $kaiSchedulerSettings.nodePoolLabelKey }}
          - --nodepool-label-key={{ . }}
          {{- end }}
          {{- with (.Values.defaultNodePool | default dict).name }}
          - --default-nodepool-name={{ . }}
          {{- end }}
          {{- with dig "args" "schedulingShardArgs" "" .Values.nodePoolController }}
          - --scheduling-shard-args={{ . }}
          {{- end }}
          {{- /* Beside an existing KAI Scheduler the chart leaves the default NodePool to this hook. */}}
          {{- if .Values.defaultNodePool.enabled }}
          - --ensure-default-nodepool
          - --default-nodepool-spec={{ toJson (.Values.defaultNodePool.spec | default dict) }}
          {{- end }}
        env:
          {{- include "kai-resource-management.godebug" . | nindent 10 }}
        resources:
          {{- toYaml (.Values.migrateShards.resources | default (dict "limits" (dict "cpu" "500m" "memory" "256Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | nindent 10 }}
        terminationMessagePolicy: FallbackToLogsOnError
        {{- include "kai-resource-management.securityContext" . | nindent 8 }}
      restartPolicy: Never
      {{- include "kai-resource-management.podScheduling" . | nindent 6 }}
{{- end }}
