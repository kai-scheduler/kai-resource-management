{{- /* Next to an existing KAI Scheduler the migrate-shards hook creates it instead. */}}
{{- if and .Values.defaultNodePool.enabled (not (include "kai-resource-management.usesExistingKaiScheduler" .)) }}
# Default catch-all NodePool
apiVersion: kai.resources/v1alpha1
kind: NodePool
metadata:
  name: {{ .Values.defaultNodePool.name | default "default" }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  {{- toYaml (.Values.defaultNodePool.spec | default dict) | nindent 2 }}
{{- end }}
