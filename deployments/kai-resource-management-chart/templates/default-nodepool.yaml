{{- /*
Beside an existing KAI Scheduler the migrate-shards hook creates it instead, from the default
shard when there is one: Helm picks what to create before any hook runs, so only one of them
may create it. kai-scheduler.enabled unset means bundled.
*/}}
{{- if and .Values.defaultNodePool.enabled (dig "enabled" true (index .Values "kai-scheduler")) }}
# Default catch-all NodePool
apiVersion: kai.resources/v1alpha1
kind: NodePool
metadata:
  name: {{ .Values.defaultNodePool.name | default "default" }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  {{- toYaml (.Values.defaultNodePool.spec | default dict) | nindent 2 }}
{{- end }}
