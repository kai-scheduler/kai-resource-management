# Names are prefixed to avoid colliding with the kai-scheduler subchart's own crd-manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kai-resource-management-crd-manager
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-resource-management-crd-manager
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
    - departments.kai.resources
    - krmconfigs.kai.resources
    - managednodesconfigs.kai.resources
    - nodepools.kai.resources
    - projects.kai.resources
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-resource-management-crd-manager
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-resource-management-crd-manager
subjects:
  - kind: ServiceAccount
    name: kai-resource-management-crd-manager
    namespace: {{ .Release.Namespace }}
