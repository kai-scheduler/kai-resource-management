{{- /*
The cert covers every webhook, so it is rendered when any is served - matching the binary,
whose registerValidationWebhooks starts no TLS server at all when the project and department
flags are false and external queues are not allowed. Allowing external queues is what makes
the binary serve /validate-queue, so it gates the cert even though queue has no flag of its own.
*/ -}}
{{- $pcWebhook := .Values.projectController.webhook | default dict }}
{{- $externalQueues := (.Values.commonArgs | default dict).allowExternalQueues }}
{{- if and .Values.projectController.enabled (or $pcWebhook.project $pcWebhook.department $externalQueues) }}
{{- $webhook := $pcWebhook }}
{{- $secretName := $webhook.certSecretName | default "project-controller-tls-secret" }}
{{- $webhookPort := int ($webhook.port | default 443) }}
{{- $openshift := include "kai-resource-management.openshift" . }}
{{- $certs := dict }}
{{- if not $openshift }}
{{- $certs = fromYaml (include "kai-resource-management.webhookCerts" (dict "root" $ "service" "project-controller" "secretName" $secretName)) }}
{{ include "kai-resource-management.webhookSecret" (dict "root" $ "service" "project-controller" "secretName" $secretName "certs" $certs) }}
{{- end }}
{{- if or $webhook.project $webhook.department }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kai-project-validation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
  {{- if $openshift }}
  annotations:
    # The service-CA operator injects the CA matching the serving cert it minted into the
    # Service's serving-cert Secret; the chart must not render a caBundle of its own.
    service.beta.openshift.io/inject-cabundle: "true"
  {{- end }}
webhooks:
  {{- if $webhook.project }}
  - name: project-controller-project.{{ .Release.Namespace }}.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      {{- if not $openshift }}
      caBundle: {{ $certs.ca }}
      {{- end }}
      service:
        name: project-controller
        namespace: {{ .Release.Namespace }}
        path: /validate-project
        port: {{ $webhookPort }}
    rules:
      # No DELETE. The handler only decodes request.object, which the API server leaves empty
      # on delete, so a DELETE rule would fail every decode and - under failurePolicy Fail -
      # block Project deletion outright. Deletion is guarded by the controller's finalizer
      # and the delete-blockers ConfigMap instead, which can wait for dependents to drain.
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["kai.resources"]
        apiVersions: ["v1alpha1"]
        resources: ["projects"]
        scope: Cluster
  {{- end }}
  {{- if $webhook.department }}
  - name: project-controller-department.{{ .Release.Namespace }}.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      {{- if not $openshift }}
      caBundle: {{ $certs.ca }}
      {{- end }}
      service:
        name: project-controller
        namespace: {{ .Release.Namespace }}
        # The binary serves departments on their own path rather than sharing
        # /validate-project, so the two are gateable independently.
        path: /validate-department
        port: {{ $webhookPort }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["kai.resources"]
        apiVersions: ["v1alpha1"]
        resources: ["departments"]
        scope: Cluster
  {{- end }}
{{- end }}
{{- if $externalQueues }}
---
# Its own configuration, not a third entry above: it validates KAI's Queues and follows
# allowExternalQueues, not the project and department toggles. It sits beside KAI's own Queue
# webhook; both are called and either can reject.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kai-queue-tree-validation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
  {{- if $openshift }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  {{- end }}
webhooks:
  - name: project-controller-queue.{{ .Release.Namespace }}.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    # Only a queue KRM does not own, gaining a parent, can end up under a KRM queue, so only
    # those writes are sent here; an outage blocks nothing else. The handler applies the same rules.
    # Every field is guarded with has(): an evaluation error rejects the write.
    matchConditions:
      - name: has-parent
        expression: "has(object.spec) && has(object.spec.parentQueue) && object.spec.parentQueue != ''"
      - name: not-owned-by-krm
        expression: >-
          !has(object.metadata.ownerReferences) ||
          !object.metadata.ownerReferences.exists(r,
          r.apiVersion.startsWith('kai.resources/') && r.kind in ['Project', 'Department'])
      - name: parent-changed
        expression: >-
          request.operation != 'UPDATE' ||
          !has(oldObject.spec) || !has(oldObject.spec.parentQueue) ||
          oldObject.spec.parentQueue != object.spec.parentQueue
    clientConfig:
      {{- if not $openshift }}
      caBundle: {{ $certs.ca }}
      {{- end }}
      service:
        name: project-controller
        namespace: {{ .Release.Namespace }}
        path: /validate-queue
        port: {{ $webhookPort }}
    rules:
      # No DELETE, as for Projects: removing a queue cannot place one under a KRM queue.
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["scheduling.run.ai"]
        apiVersions: ["v2"]
        resources: ["queues"]
        scope: Cluster
{{- end }}
{{- end }}
