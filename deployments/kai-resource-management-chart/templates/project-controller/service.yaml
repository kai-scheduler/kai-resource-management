{{- if .Values.projectController.enabled }}
{{- $comp := .Values.projectController }}
{{- $svc := $comp.service | default dict }}
{{- $metrics := $svc.metrics | default dict }}
{{- $metricsPort := int ($metrics.port | default 9400) }}
{{- $metricsPortName := $metrics.portName | default "metrics" }}
{{- $metricsTargetPort := int ($metrics.targetPort | default 9400) }}
{{- $webhook := $comp.webhook | default dict }}
{{- $webhookOn := or $webhook.project $webhook.department }}
{{- $webhookPort := int ($webhook.port | default 443) }}
{{- $webhookTargetPort := int ($webhook.targetPort | default 8443) }}
apiVersion: v1
kind: Service
metadata:
  name: project-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: project-controller
    {{- include "kai-resource-management.labels" . | nindent 4 }}
  {{- if and $webhookOn (include "kai-resource-management.openshift" .) }}
  annotations:
    # On OpenShift the service-CA operator mints the webhook serving cert into this Secret.
    service.beta.openshift.io/serving-cert-secret-name: {{ $webhook.certSecretName | default "project-controller-tls-secret" }}
  {{- end }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  selector:
    app: project-controller
  ports:
    - name: {{ $metricsPortName }}
      protocol: TCP
      port: {{ $metricsPort }}
      targetPort: {{ $metricsTargetPort }}
    {{- if $webhookOn }}
    - name: webhook
      protocol: TCP
      port: {{ $webhookPort }}
      targetPort: {{ $webhookTargetPort }}
    {{- end }}
{{- end }}
