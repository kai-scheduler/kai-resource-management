{{- if and .Values.projectController.enabled .Values.rbac.create }}
{{- $features := .Values.projectController.features | default dict }}
{{- if $features.createNamespaces }}
# --- namespace creation ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-project-controller-ns-creation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "namespaces/finalizers"]
    verbs: ["create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-project-controller-ns-creation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-project-controller-ns-creation
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $features.createRoleBindings }}
# --- rolebinding creation (replicate per-project RoleBindings) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-project-controller-rolebinding-creation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-project-controller-rolebinding-creation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-project-controller-rolebinding-creation
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kai-project-controller-rolebinding-creation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-project-controller-rolebinding-creation
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $features.limitRange }}
# --- limit-range ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-project-controller-limit-range
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-project-controller-limit-range
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-project-controller-limit-range
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-project-controller-limit-range-per-project
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["create"]
  # name-in-path verbs stay scoped to the single limit-range object the controller manages
  # (the binary's default name, kai-limit-range).
  - apiGroups: [""]
    resourceNames: ["kai-limit-range"]
    resources: ["limitranges", "limitranges/finalizers"]
    verbs: ["update", "delete", "patch"]
{{- end }}
{{- end }}
