{{- if and .Values.nodePoolController.enabled (.Values.nodePoolController.webhook | default dict).nodepool }}
{{- $webhook := .Values.nodePoolController.webhook }}
{{- $secretName := $webhook.certSecretName | default "nodepool-controller-tls-secret" }}
{{- $webhookPort := int ($webhook.port | default 443) }}
{{- $openshift := include "kai-resource-management.openshift" . }}
{{- $certs := dict }}
{{- if not $openshift }}
{{- $certs = fromYaml (include "kai-resource-management.webhookCerts" (dict "root" $ "service" "nodepool-controller" "secretName" $secretName)) }}
{{ include "kai-resource-management.webhookSecret" (dict "root" $ "service" "nodepool-controller" "secretName" $secretName "certs" $certs) }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kai-nodepool-validation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
  {{- if $openshift }}
  annotations:
    # The service-CA operator injects the CA matching the serving cert it minted into the
    # Service's serving-cert Secret; the chart must not render a caBundle of its own.
    service.beta.openshift.io/inject-cabundle: "true"
  {{- end }}
webhooks:
  - name: nodepool-controller.{{ .Release.Namespace }}.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      {{- if not $openshift }}
      caBundle: {{ $certs.ca }}
      {{- end }}
      service:
        name: nodepool-controller
        namespace: {{ .Release.Namespace }}
        # Path generated by controller-runtime from the GVK, not chosen by us:
        # /validate-<group with dots as dashes>-<version>-<lowercase kind>.
        path: /validate-kai-resources-v1alpha1-nodepool
        port: {{ $webhookPort }}
    rules:
      # CREATE only: the validator's ValidateUpdate and ValidateDelete are deliberate no-ops
      # because labelKey/labelValue are immutable in the CRD.
      - operations: ["CREATE"]
        apiGroups: ["kai.resources"]
        apiVersions: ["v1alpha1"]
        resources: ["nodepools"]
        scope: Cluster
{{- end }}
