{{- if .Values.nodePoolController.enabled }}
{{- $comp := .Values.nodePoolController }}
{{- $svc := $comp.service | default dict }}
{{- $metricsPort := int (($comp.metrics | default dict).port | default 9400) }}
{{- $metricsPortName := ($comp.metrics | default dict).name | default "metrics" }}
{{- $svcPort := int ($svc.port | default 8080) }}
{{- $svcTargetPort := int ($svc.targetPort | default 8080) }}
{{- $webhook := $comp.webhook | default dict }}
{{- $webhookOn := $webhook.nodepool }}
{{- $webhookPort := int ($webhook.port | default 443) }}
{{- $webhookTargetPort := int ($webhook.targetPort | default 8443) }}
apiVersion: v1
kind: Service
metadata:
  name: nodepool-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodepool-controller
    {{- include "kai-resource-management.labels" . | nindent 4 }}
  {{- if and $webhookOn (include "kai-resource-management.openshift" .) }}
  annotations:
    # On OpenShift the service-CA operator mints the webhook serving cert into this Secret.
    service.beta.openshift.io/serving-cert-secret-name: {{ $webhook.certSecretName | default "nodepool-controller-tls-secret" }}
  {{- end }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  selector:
    app: nodepool-controller
  ports:
    - name: np-metrics
      protocol: TCP
      port: {{ $svcPort }}
      targetPort: {{ $svcTargetPort }}
    - name: {{ $metricsPortName }}
      protocol: TCP
      port: {{ $metricsPort }}
      targetPort: {{ $metricsPort }}
    {{- if $webhookOn }}
    - name: webhook
      protocol: TCP
      port: {{ $webhookPort }}
      targetPort: {{ $webhookTargetPort }}
    {{- end }}
{{- end }}
