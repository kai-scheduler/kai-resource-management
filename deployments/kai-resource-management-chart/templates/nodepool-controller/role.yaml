{{- if and .Values.nodePoolController.enabled .Values.rbac.create }}
{{- $schedulerNamespace := include "kai-resource-management.schedulerNamespace" . }}
# Namespaced Role for the nodepool-controller's per-shard ServiceMonitors, which live beside
# the scheduler: an existing KAI Scheduler may run outside the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kai-nodepool-controller
  namespace: {{ $schedulerNamespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kai-nodepool-controller
  namespace: {{ $schedulerNamespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kai-nodepool-controller
subjects:
  - kind: ServiceAccount
    name: nodepool-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
