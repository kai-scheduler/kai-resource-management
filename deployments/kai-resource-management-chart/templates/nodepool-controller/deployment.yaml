{{- if .Values.nodepoolController.enabled }}
{{- $comp := .Values.nodepoolController }}
{{- $a := $comp.args | default dict }}
{{- include "kai-resource-management.reject-shared-arg-override" (dict "comp" "nodepoolController" "args" $a) }}
{{- $commonArgs := .Values.commonArgs | default dict }}
{{- $kai := index .Values "kai-scheduler" }}
{{- $nodePoolLabelKey := ($kai.global | default dict).nodePoolLabelKey }}
{{- $defaultNodepoolName := (.Values.defaultNodePool | default dict).name }}
{{- $metrics := $comp.metrics | default dict }}
{{- $replicas := $comp.replicas | default 1 }}
{{- $metricsPort := int ($metrics.port | default 9400) }}
{{- $metricsPortName := $metrics.name | default "metrics" }}
{{- $webhook := $comp.webhook | default dict }}
{{- $webhookOn := $webhook.nodepool }}
{{- $webhookTargetPort := int ($webhook.targetPort | default 8443) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodepool-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodepool-controller
    {{- include "kai-resource-management.labels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: nodepool-controller
  template:
    metadata:
      labels:
        app: nodepool-controller
    spec:
      serviceAccountName: nodepool-controller
      containers:
        - name: nodepool-controller
          image: {{ include "kai-resource-management.image" (dict "root" $ "image" $comp.image) }}
          imagePullPolicy: {{ include "kai-resource-management.imagePullPolicy" (dict "root" $ "image" $comp.image) }}
          {{- include "kai-resource-management.securityContext" . | nindent 10 }}
          env:
            {{- include "kai-resource-management.godebug" . | nindent 12 }}
          ports:
            - name: {{ $metricsPortName }}
              containerPort: {{ $metricsPort }}
            {{- if $webhookOn }}
            - name: webhook
              containerPort: {{ $webhookTargetPort }}
            {{- end }}
          args:
            # Flags render only when set (empty ⇒ the binary's own default applies). The node-pool
            # label key is the shared vocabulary sourced from the kai-scheduler subchart.
            - --metrics-port
            - {{ $metricsPort | quote }}
            - --scheduler-namespace
            - {{ .Release.Namespace }}
            # Always explicit: the binary defaults this to true and would then start a TLS
            # server with no certificate mounted.
            - --enable-nodepool-validation-webhook={{ if $webhookOn }}true{{ else }}false{{ end }}
            {{- if $webhookOn }}
            - --webhook-port
            - {{ $webhookTargetPort | quote }}
            {{- end }}
            {{- include "kai-resource-management.stringArgs" (dict
                "nodepool-label-key"      $nodePoolLabelKey
                "default-nodepool-name"   $defaultNodepoolName
                "metrics-namespace"       $metrics.namespace
                "dcgm-exporter-namespace" $comp.dcgmExporterNamespace
                "finalizer-domain"        $commonArgs.finalizerDomain
                "scheduler-name"          $commonArgs.schedulerName) | nindent 12 }}
            {{- include "kai-resource-management.componentArgs" $a | nindent 12 }}
            {{- if $a.debug }}
            - --debug
            {{- end }}
            {{- $leaderElect := .Values.global.leaderElection }}
            {{- if hasKey $a "leaderElect" }}{{- $leaderElect = $a.leaderElect }}{{- end }}
            {{- if or $leaderElect (gt (int $replicas) 1) }}
            - --leader-elect
            {{- end }}
          {{- if $webhookOn }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml ($comp.resources | default (dict "limits" (dict "cpu" "900m" "memory" "1Gi") "requests" (dict "cpu" "450m" "memory" "512Mi"))) | nindent 12 }}
      {{- if $webhookOn }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ $webhook.certSecretName | default "nodepool-controller-tls-secret" }}
      {{- end }}
      {{- include "kai-resource-management.podScheduling" . | nindent 6 }}
{{- end }}
