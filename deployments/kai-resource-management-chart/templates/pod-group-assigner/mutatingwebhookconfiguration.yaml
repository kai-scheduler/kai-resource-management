{{- if and .Values.podGroupAssigner.enabled .Values.podGroupAssigner.webhook.enabled }}
{{- $comp := .Values.podGroupAssigner }}
{{- $nsProjectLabelKey := "kai/project" }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kai-pod-group-mutation
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
webhooks:
  - name: pod-group-assigner.{{ .Release.Namespace }}.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    reinvocationPolicy: IfNeeded
    failurePolicy: Fail
    namespaceSelector:
      matchExpressions:
        - key: {{ $nsProjectLabelKey | quote }}
          operator: Exists
    clientConfig:
      # caBundle is populated separately (genCA/genSignedCert), rendered together with the
      # TLS Secret. Empty until then — the webhook will not serve without it.
      caBundle: ""
      service:
        name: pod-group-assigner
        namespace: {{ .Release.Namespace }}
        path: /mutate-pod-group
    rules:
      - operations: ["CREATE"]
        apiGroups: ["scheduling.run.ai"]
        apiVersions: ["*"]
        resources: ["podgroups"]
        scope: Namespaced
{{- end }}
