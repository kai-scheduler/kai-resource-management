version: "2"
run:
  timeout: 8m
  tests: true
output:
  formats:
    text:
      path: stdout
      color: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - govet
    - unused
    # Bug-finders. staticcheck subsumes gosimple and stylecheck in v2.
    - staticcheck
    - errorlint
    - ineffassign
    - nilerr
    - wastedassign
    - bodyclose
    - noctx
    - durationcheck
    - makezero
    - reassign
    - fatcontext
    - exhaustive
    - gosec
    # Correctness of names, conversions and test wiring.
    - errname
    - predeclared
    - goprintffuncname
    - unconvert
    - copyloopvar
    - usetesting
    - tparallel
    - asciicheck
    - bidichk
    # Style with a low false-positive rate.
    - gocritic
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        # A single-case type switch reads better than an if with a type assertion
        # when the case is about the type, and it stays open to more cases.
        - singleCaseSwitch
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
        path: (.+)_test.go
    paths:
      - generated
      - third_party$
      - builtin$
severity:
  default: error
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - generated
      - third_party$
      - builtin$
