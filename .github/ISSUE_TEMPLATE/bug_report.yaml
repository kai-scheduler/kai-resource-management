name: Bug report
description: Report a problem with KAI Resource Management
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest configuration or sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - KAI Resource Management version or commit:
        - KAI Scheduler version:
        - Kubernetes version:
        - Helm version:
        - Platform or distribution:
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration and logs
      description: Remove credentials, tokens, certificates, and other sensitive data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain sensitive information.
          required: true
