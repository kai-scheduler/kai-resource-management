name: Enhancement
description: Suggest an improvement to KAI Resource Management
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should be solved?
      description: Describe the user or operator problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior, configuration, and user experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility or migration considerations
