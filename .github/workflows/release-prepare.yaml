# Release, step 1 of 2 — Prepare Changelog (manual dispatch).
#
# Folds the pending changie fragments (.changes/unreleased/*.yaml) into CHANGELOG.md as a new
# "## [VERSION]" section, clears the fragments, and opens a PR against the branch this workflow
# was dispatched on, which is always the v*.* release branch for that version.
#
# A maintainer reviews and merges that PR, unless the run set auto-merge: the PR then approves and
# merges itself when it changes nothing but the changelog. Merging it triggers release-publish.yaml
# (step 2), which tags the version and creates the GitHub Release.

name: Release — Prepare Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0 (run on the v*.* release branch, not on main)'
        required: true
        type: string
      auto-merge:
        description: 'Approve and merge the PR itself, when it changes nothing but the changelog'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Fold changelog & open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.KAIBOT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      - name: Record a newly bundled KAI Scheduler
        env:
          GH_TOKEN: ${{ secrets.KAIBOT_TOKEN }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' || true)"
          if [ -z "$previous" ]; then
            echo "No earlier release on this branch to compare with."
            exit 0
          fi
          bundled="$(hack/subchart-versions.sh changes "$previous" | sed -n 's/^kai-scheduler: //p')"
          if [ -n "$bundled" ]; then
            make changelog KIND=Changed BODY="Bundle KAI Scheduler v$bundled"
          fi

      - name: Fold fragments into CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: make changelog-release VERSION="$VERSION"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.KAIBOT_TOKEN }}
          APPROVER_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          VERSION: ${{ inputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="release/prepare-$VERSION"

          git config --local user.name "kai-release-bot"
          git config --local user.email "action@github.com"

          git switch -c "$BRANCH"
          git add -A
          git commit -s -m "chore(release): prepare changelog for $VERSION"
          git push --force-with-lease -u origin "$BRANCH"

          BODY="${RUNNER_TEMP:-/tmp}/pr-body.md"
          {
            echo "Automated by the **Release — Prepare Changelog** workflow."
            echo
            echo "Folds the pending \`.changes/unreleased/\` fragments into \`CHANGELOG.md\` as \`## [$VERSION]\` and clears them. \`CHANGELOG.md\` is the source of truth."
            echo
            echo "**Merging this PR** triggers \`release-publish.yaml\`, which tags \`$VERSION\` and creates the GitHub Release from this changelog section."
            echo
            echo "- Review the new \`## [$VERSION]\` section for accuracy."
            echo "- Target branch: \`$BASE\`."
          } > "$BODY"

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(release): prepare changelog for $VERSION" \
            --label skip-changelog \
            --body-file "$BODY"

          if [ "$AUTO_MERGE" != true ]; then
            exit 0
          fi

          # Merges without a person, so only the commit pushed above, and only
          # if it changes nothing but the changelog: anything else needs a
          # maintainer.
          sha="$(git rev-parse HEAD)"
          pr="$(gh pr view "$BRANCH" --json number,headRefOid,files)"
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$sha" ]; then
            echo "::warning::The pull request head is no longer $sha; leaving it for a maintainer."
            exit 0
          fi
          for file in $(jq -r '.files[].path' <<<"$pr"); do
            case "$file" in
              CHANGELOG.md | .changes/unreleased/*.yaml) ;;
              *)
                echo "::warning::$file is not a changelog file; leaving the pull request for a maintainer."
                exit 0
                ;;
            esac
          done

          # Approved by github-actions and merged by KaiPilotBot: the author
          # cannot approve their own pull request, and a merge made with
          # GITHUB_TOKEN would not trigger release-publish.yaml.
          number="$(jq -r .number <<<"$pr")"
          GH_TOKEN="$APPROVER_TOKEN" gh api --method POST \
            "repos/$GITHUB_REPOSITORY/pulls/$number/reviews" \
            -f event=APPROVE -f commit_id="$sha" >/dev/null
          gh pr merge "$number" --auto --squash --match-head-commit "$sha"
