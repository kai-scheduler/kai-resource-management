name: KAI Resource Management - Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'merge_group' && github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-build-and-test-required:
    name: Check if build and test are required
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.changes/**'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.changes/**'

  validate-and-test:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Go runs both on the host and in containers here, so both sets of
      # directories are cached. The key is per job: sharing one with build let
      # whichever job saved first define the entry, and actions/cache never
      # overwrites an existing key.
      - name: Cache the Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
            ~/go/pkg/mod
            .gocache
          key: go-validate-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-validate-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          # The cache step above holds the module cache. setup-go would also
          # store ~/.cache/go-build, which the Makefile's GOCACHE overrides.
          cache: false

      - name: Run validation
        run: make validate

      - name: Run tests
        run: make test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/coverage.out

      - name: Calculate total coverage
        run: |
          if [ ! -s coverage/coverage.out ]; then
            exit 0
          fi

          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "$COVERAGE" > coverage/total-coverage.txt

      - name: Archive total coverage
        if: hashFiles('coverage/total-coverage.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: total-coverage
          path: coverage/total-coverage.txt

  # Reports coverage, never fails on it: a pull request may legitimately move the
  # number down. The comment itself is posted by post-coverage-comment.yaml, which
  # has the write token this job deliberately does not.
  code-coverage-report:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [ validate-and-test, check-build-and-test-required ]
    if: github.event_name != 'merge_group' && needs.check-build-and-test-required.outputs.code == 'true' && github.base_ref == 'main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The per-package table is a diff against main's profile, published by
      # update-coverage-badge.yaml.
      - uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b
        id: coverage_reporter
        continue-on-error: true
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.out"
          root-package: "github.com/kai-scheduler/kai-resource-management"
          github-baseline-workflow-ref: update-coverage-badge.yaml
          skip-comment: true

      - name: Download total coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: total-coverage
          path: coverage-summary

      # The badge holds main's total, which is what the delta is measured from.
      - name: Download coverage badge branch
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: coverage-badge
          path: coverage-badge

      - name: Calculate coverage totals
        id: coverage_totals
        run: |
          PR_COVERAGE=$(cat coverage-summary/total-coverage.txt)
          echo "pr=$PR_COVERAGE" >> $GITHUB_OUTPUT

          BASELINE_COVERAGE=$(grep -hoE '[0-9]+\.[0-9]+%' coverage-badge/badges/coverage.svg 2>/dev/null | head -1 | tr -d '%')
          echo "baseline=$BASELINE_COVERAGE" >> $GITHUB_OUTPUT

          if [ -n "$BASELINE_COVERAGE" ]; then
            DELTA=$(awk -v pr="$PR_COVERAGE" -v baseline="$BASELINE_COVERAGE" 'BEGIN { printf "%.2f", pr - baseline }')
            echo "delta=$DELTA" >> $GITHUB_OUTPUT
          fi

      - name: Save coverage report to file
        env:
          REPORT_BODY: ${{ steps.coverage_reporter.outputs.coverage_report }}
          BASELINE_COVERAGE: ${{ steps.coverage_totals.outputs.baseline }}
          PR_COVERAGE: ${{ steps.coverage_totals.outputs.pr }}
          COVERAGE_DELTA: ${{ steps.coverage_totals.outputs.delta }}
        run: |
          {
            if [ -n "$BASELINE_COVERAGE" ]; then
              echo "**Total coverage:** ${BASELINE_COVERAGE}% -> ${PR_COVERAGE}% (delta ${COVERAGE_DELTA}%)"
            else
              echo "**Total coverage:** ${PR_COVERAGE}%"
            fi

            if [ -n "$REPORT_BODY" ]; then
              echo ""
              echo "$REPORT_BODY"
            fi
          } > coverage-report.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-for-comment
          path: coverage-report.txt

      # post-coverage-comment.yaml runs on workflow_run, where the pull request is
      # not in the event payload.
      - name: Save PR number
        run: echo "${{ github.event.number }}" > pr_number.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number-for-comment
          path: pr_number.txt

  build:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Only the docker-mounted directories: no Go runs on the host here.
      - name: Cache the Go build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          # No host Go build runs in this job, so setup-go's cache would only
          # save and restore directories nothing reads. The Docker-mounted
          # cache above is the one that matters.
          cache: false

      # /mnt is the larger disk.
      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker-data
          echo '{"data-root": "/mnt/docker-data"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the image cache directory
        run: |
          sudo mkdir -p /mnt/images
          sudo chown -R $USER:$USER /mnt/images

      # Consumed by the e2e job.
      - name: Cache the images and the chart
        uses: actions/cache@v6
        with:
          path: /mnt/images
          key: images-${{ github.sha }}

      - name: Extract package version
        id: package_version
        run: |
          GIT_REV=$(git rev-parse --short HEAD | sed 's/^0*//')
          PACKAGE_VERSION=0.0.0-$GIT_REV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo $PACKAGE_VERSION

      - name: Build service images
        shell: bash
        run: |
          make build VERSION=$PACKAGE_VERSION \
            DOCKER_BUILDX_ADDITIONAL_ARGS="--load --cache-from type=gha --cache-to type=gha,mode=max"

          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "$PACKAGE_VERSION" || true)
          if [ -z "$images" ]; then
            echo "make build tagged no images with $PACKAGE_VERSION" >&2
            docker images >&2
            exit 1
          fi
          docker save $images | gzip > /mnt/images/docker_images.tgz

      - name: Build Helm chart
        run: |
          helm dependency build ./deployments/kai-resource-management-chart
          mkdir -p ./bin/charts
          helm package ./deployments/kai-resource-management-chart -d ./bin/charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION
          cp ./bin/charts/kai-resource-management-$PACKAGE_VERSION.tgz /mnt/images/

  skip-build-and-test-message:
    name: Skip Build and Test Message
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip message
        run: |
          echo "Skipping build and test since only documentation files (.md or docs/) were changed."

  e2e-tests:
    name: Run E2E Tests
    needs: [ build, validate-and-test, check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup e2e cluster
        uses: ./.github/actions/setup-e2e-cluster
        with:
          package_version: ${{ needs.build.outputs.package_version }}

      - name: Install KAI Resource Management
        run: |
          helm install krm /mnt/images/kai-resource-management-$PACKAGE_VERSION.tgz \
            --namespace kai-resource-management --create-namespace \
            --values ./hack/e2e-values.yaml \
            --set image.tag=$PACKAGE_VERSION \
            --wait --timeout 10m

      - name: Run e2e tests
        run: make test-e2e GINKGO_FLAGS="--output-dir=. --json-report=e2e-report.json"

      - name: Report skipped specs
        if: always()
        run: |
          jq -r '.[].SpecReports[] | select(.State == "skipped")
            | ([.ContainerHierarchyTexts[], .LeafNodeText] | join(" > "))' \
            e2e-report.json 2>/dev/null || echo "No skipped specs."

      - name: Dump controller logs
        if: failure()
        run: |
          kubectl -n kai-resource-management get pods -o wide || true
          for deploy in krm-operator project-controller nodepool-controller pod-group-assigner; do
            echo "===== $deploy ====="
            kubectl -n kai-resource-management logs deploy/$deploy --tail=200 || true
          done

      - name: Uninstall KAI Resource Management
        run: |
          helm uninstall krm -n kai-resource-management
          echo "Waiting up to 60 seconds for pods to terminate..."
          for i in {1..12}; do
            REMAINING=$(kubectl get pods -n kai-resource-management --no-headers 2>/dev/null \
              | grep -v Terminating | wc -l)
            if [ "$REMAINING" -eq 0 ]; then
              echo "All pods gone or terminating."
              exit 0
            fi
            echo "$REMAINING pod(s) still running... (attempt $i/12)"
            sleep 5
          done
          echo "Pods did not terminate within 60 seconds; uninstall is incomplete."
          kubectl get pods -n kai-resource-management
          exit 1

  cleanup-images-cache:
    name: Cleanup Images Cache
    needs: [ e2e-tests, check-build-and-test-required ]
    # No always(): a failed e2e must keep the cache so "Re-run failed jobs" can
    # restore the images. Stale entries fall to GitHub's own cache eviction.
    if: success() && needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the images cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "images-${{ github.sha }}" --repo ${{ github.repository }}
