name: KAI Resource Management - Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'merge_group' && github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-build-and-test-required:
    name: Check if build and test are required
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.changes/**'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.changes/**'

  validate-and-test:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # .gocache is where the Makefile points GOCACHE, so the Go commands that run
      # on the host share a cache between runs; the two docker-mounted directories
      # are the same for the commands that run in a container.
      #
      # Every job in this workflow uses this one key deliberately: the content is
      # the same, and a key per job would multiply what the ref stores against the
      # repository's 10 GB cache budget.
      - name: Cache the Go build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
            .gocache
          key: go-docker-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-docker-${{ runner.os }}-

      # --- BEGIN private API module access ---------------------------------
      # TEMPORARY: needed only while kai-resource-management-api is a private
      # repository. GITHUB_TOKEN is scoped to this repository and cannot read
      # it. Remove this block once the repositories are public: the public Go
      # module proxy will then serve the module anonymously.
      - name: Mint a token for the private API module
        uses: actions/create-github-app-token@v2
        id: apptoken
        with:
          app-id: ${{ secrets.KAI_MODULE_READER_APP_ID }}
          private-key: ${{ secrets.KAI_MODULE_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kai-resource-management-api

      # Scoped to the exact module, not github.com/kai-scheduler/*: GOPRIVATE
      # also disables checksum-database verification, and the sibling module
      # github.com/kai-scheduler/api is public and is in the sumdb.
      - name: Configure Go and git for the private API module
        env:
          TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          MODULE="github.com/kai-scheduler/kai-resource-management-api"
          echo "GOPRIVATE=$MODULE" >> "$GITHUB_ENV"
          # The rewrite is scoped to this one repository, so the token is
          # never sent to any other GitHub URL.
          git config --global \
            url."https://x-access-token:${TOKEN}@$MODULE".insteadOf \
            "https://$MODULE"
          echo "GIT_CONFIG_GLOBAL=$HOME/.gitconfig" >> "$GITHUB_ENV"
      # --- END private API module access -----------------------------------

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run validation
        run: make validate

  build:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache the Go build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
            .gocache
          key: go-docker-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-docker-${{ runner.os }}-

      # --- BEGIN private API module access ---------------------------------
      # TEMPORARY: needed only while kai-resource-management-api is a private
      # repository. GITHUB_TOKEN is scoped to this repository and cannot read
      # it. Remove this block once the repositories are public: the public Go
      # module proxy will then serve the module anonymously.
      - name: Mint a token for the private API module
        uses: actions/create-github-app-token@v2
        id: apptoken
        with:
          app-id: ${{ secrets.KAI_MODULE_READER_APP_ID }}
          private-key: ${{ secrets.KAI_MODULE_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kai-resource-management-api

      # Scoped to the exact module, not github.com/kai-scheduler/*: GOPRIVATE
      # also disables checksum-database verification, and the sibling module
      # github.com/kai-scheduler/api is public and is in the sumdb.
      # GIT_CONFIG_GLOBAL is what build/makefile/golang.mk forwards into the
      # builder container, which fetches modules into its own GOPATH volume.
      - name: Configure Go and git for the private API module
        env:
          TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          MODULE="github.com/kai-scheduler/kai-resource-management-api"
          echo "GOPRIVATE=$MODULE" >> "$GITHUB_ENV"
          # The rewrite is scoped to this one repository, so the token is
          # never sent to any other GitHub URL.
          git config --global \
            url."https://x-access-token:${TOKEN}@$MODULE".insteadOf \
            "https://$MODULE"
          echo "GIT_CONFIG_GLOBAL=$HOME/.gitconfig" >> "$GITHUB_ENV"
      # --- END private API module access -----------------------------------

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          # No host Go build runs in this job, so setup-go's cache would only
          # save and restore directories nothing reads. The Docker-mounted
          # cache above is the one that matters.
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract package version
        id: package_version
        run: |
          GIT_REV=$(git rev-parse --short HEAD | sed 's/^0*//')
          PACKAGE_VERSION=0.0.0-$GIT_REV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo $PACKAGE_VERSION

      - name: Build service images
        run: make build VERSION=$PACKAGE_VERSION

      - name: Build Helm chart
        run: |
          helm dependency build ./deployments/kai-resource-management-chart
          mkdir -p ./bin/charts
          helm package ./deployments/kai-resource-management-chart -d ./bin/charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION

  skip-build-and-test-message:
    name: Skip Build and Test Message
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip message
        run: |
          echo "Skipping build and test since only documentation files (.md or docs/) were changed."
