name: KAI Resource Management - Upload artifacts to GitHub Container Registry
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

env:
  DOCKER_REGISTRY: "ghcr.io/kai-scheduler/kai-resource-management"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract package version from tag
        run: |
          PACKAGE_VERSION=${GITHUB_REF_NAME}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo $PACKAGE_VERSION

      # No Go build cache here on purpose. This workflow only runs on a tag, and a
      # tag is a fresh cache scope that can read nothing but the default branch's,
      # which no workflow writes — so a cache step here could only ever write
      # entries that nothing restores, against the repository's 10 GB budget.

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          # No host Go build runs in this job, so setup-go's cache would only
          # save and restore directories nothing reads. The Docker-mounted
          # cache above is the one that matters.
          cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build & push
        run: make build DOCKER_BUILD_PLATFORM=linux/amd64,linux/arm64 DOCKER_REPO_BASE=${DOCKER_REGISTRY} VERSION=$PACKAGE_VERSION DOCKER_BUILDX_ADDITIONAL_ARGS=--push

      - name: Build Helm chart
        run: |
          sed -i 's#registry/local/kai-resource-management#${{ env.DOCKER_REGISTRY }}#' ./deployments/kai-resource-management-chart/values.yaml
          helm dependency build ./deployments/kai-resource-management-chart
          mkdir -p ./bin/charts
          helm package ./deployments/kai-resource-management-chart -d ./bin/charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION

      - name: Push Helm chart
        run: helm push ./bin/charts/kai-resource-management-$PACKAGE_VERSION.tgz oci://${DOCKER_REGISTRY}

      - name: Attach Helm chart to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$PACKAGE_VERSION" >/dev/null 2>&1; then
            gh release upload "$PACKAGE_VERSION" ./bin/charts/kai-resource-management-$PACKAGE_VERSION.tgz --clobber
          else
            echo "No GitHub Release for $PACKAGE_VERSION; skipping chart asset upload."
          fi

  # Publishes the `<version>-fips` variant of every image, which the chart
  # selects with global.fipsMode. Deliberately a second job rather than a step in
  # build-and-push: the two image sets share no build cache state, and a failure
  # here must not prevent the regular images and the chart from being published.
  # No chart is packaged here - one chart serves both variants.
  build-and-push-fips:
    name: Build & Push FIPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract package version from tag
        run: |
          PACKAGE_VERSION=${GITHUB_REF_NAME}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo $PACKAGE_VERSION

      # No Go build cache here either, for the reason given on the job above.

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          # Needed on the host only to run `go version -m` in the verification
          # step below, which reads build info out of an already-built binary.
          # No host Go build runs here, so setup-go's cache has nothing to hold.
          cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build & push FIPS images
        run: make build FIPS=1 DOCKER_BUILD_PLATFORM=linux/amd64,linux/arm64 DOCKER_REPO_BASE=${DOCKER_REGISTRY} VERSION=$PACKAGE_VERSION DOCKER_BUILDX_ADDITIONAL_ARGS=--push

      # The images are already pushed by this point, so this is a post-hoc audit
      # rather than a gate. It still matters: a silently dropped GOFIPS140 would
      # otherwise ship a `-fips` tag containing an ordinary binary, which nothing
      # downstream can detect. Only the Go services leave binaries in bin/; the
      # helm-hooks image carries upstream kubectl and is not FIPS-built.
      # No `set -o pipefail` here, deliberately: `grep -q` exits on its first
      # match and closes the pipe, so `go version` can take a SIGPIPE and the
      # pipeline would report failure on exactly the binaries that passed.
      - name: Verify binaries are FIPS-enabled
        run: |
          for f in bin/*-amd64 bin/*-arm64; do
            go version -m "$f" | grep -q 'GOFIPS140=v1.0.0' || { echo "$f is not FIPS-enabled"; exit 1; }
          done

  # Air-gap image locks: for each profile and platform, every image an install pulls
  # at the digest its tag points at right now. Both image sets have to exist first,
  # so this is a third job rather than a step inside either of them; it runs after
  # the release is published, so a failure costs a re-run rather than the release.
  image-locks:
    name: Generate air-gap image locks
    needs: [build-and-push, build-and-push-fips]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A tag is a fresh cache scope that nothing else restores from.
          cache: false

      # The generator reads each manifest back out of the registry, and the packages
      # are not public until the release is. `docker login` leaves the credentials
      # where the generator looks for them.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `gh release view` guard, unlike the chart upload above: that one races a
      # release created moments earlier, whereas by the time both build jobs have
      # finished a missing release is a real failure and should fail loudly.
      - name: Generate and attach the image locks
        run: |
          make image-lock VERSION="$PACKAGE_VERSION" IMAGE_LOCK_REGISTRY="$DOCKER_REGISTRY"
          gh release upload "$PACKAGE_VERSION" ./bin/imagelocks/*.yaml --clobber
