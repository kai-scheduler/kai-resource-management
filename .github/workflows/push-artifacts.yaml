name: KAI Resource Management - Upload artifacts to GitHub Container Registry
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: "ghcr.io/kai-scheduler/kai-resource-management"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract package version from tag
        run: |
          PACKAGE_VERSION=${GITHUB_REF_NAME}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo $PACKAGE_VERSION

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Helm chart
        run: |
          helm dependency build ./charts/kai-resource-management
          helm package ./charts/kai-resource-management -d ./charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION

      - name: Push Helm chart
        run: helm push ./charts/kai-resource-management-$PACKAGE_VERSION.tgz oci://${DOCKER_REGISTRY}
