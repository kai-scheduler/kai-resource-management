{{- end }}
{{- if $features.limitRange }}
# --- limit-range ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-controller-limit-range
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-controller-limit-range
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-controller-limit-range
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-controller-limit-range-per-project
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["create"]
  # name-in-path verbs stay scoped to the single limit-range object the controller manages
  # (the binary's default name, kai-limit-range).
  - apiGroups: [""]
    resourceNames: ["kai-limit-range"]
    resources: ["limitranges", "limitranges/finalizers"]
    verbs: ["update", "delete", "patch"]
{{- end }}
{{- end }}
