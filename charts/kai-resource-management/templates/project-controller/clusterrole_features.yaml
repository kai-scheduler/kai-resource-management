metadata:
  name: project-controller-rolebinding-creation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-controller-rolebinding-creation
subjects:
  - kind: ServiceAccount
