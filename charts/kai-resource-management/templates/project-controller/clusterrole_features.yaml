{{- if and .Values.projectController.enabled .Values.rbac.create }}
{{- $features := .Values.projectController.features | default dict }}
{{- if $features.clusterWideSecret }}
# --- cluster-wide secrets ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-controller-cluster-secret
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-controller-cluster-secret
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-controller-cluster-secret
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-controller-cluster-secret-per-project
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resourceNames: ["default"]
    resources: ["serviceaccounts"]
    verbs: ["update", "create"]
  - apiGroups: [""]
    resources: ["secrets", "secrets/finalizers"]
    verbs: ["update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-controller-secret-patcher
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-controller-secret-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-controller-secret-patcher
subjects:
  - kind: ServiceAccount
    name: project-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
