{{- if .Values.projectController.enabled }}
{{- $comp := .Values.projectController }}
{{- $svc := $comp.service | default dict }}
{{- $metrics := $svc.metrics | default dict }}
{{- $metricsPort := int ($metrics.port | default 9400) }}
{{- $metricsPortName := $metrics.portName | default "metrics" }}
{{- $metricsTargetPort := int ($metrics.targetPort | default 9400) }}
apiVersion: v1
kind: Service
metadata:
  name: project-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: project-controller
    {{- include "kai-resource-management.labels" . | nindent 4 }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  selector:
    app: project-controller
  ports:
    - name: {{ $metricsPortName }}
      protocol: TCP
      port: {{ $metricsPort }}
      targetPort: {{ $metricsTargetPort }}
{{- end }}
