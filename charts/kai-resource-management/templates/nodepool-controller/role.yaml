{{- if and .Values.nodepoolController.enabled .Values.rbac.create }}
# Namespaced Role: the nodepool-controller manages its own workload-plane objects
# (its Deployment/Service/ConfigMaps/ServiceMonitors) inside the install namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodepool-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodepool-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodepool-controller
subjects:
  - kind: ServiceAccount
    name: nodepool-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
