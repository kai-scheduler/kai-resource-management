{{- if and .Values.nodepoolController.enabled .Values.rbac.create }}
# Allows reading nodepool-related data and editing the resource-management CRDs and Nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodepool-controller
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kai.resources"]
    resources: ["nodepools", "managednodesconfigs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["kai.resources"]
    resources: ["nodepools/status", "managednodesconfigs/status"]
    verbs: ["get", "update", "patch", "watch"]
  - apiGroups: ["kai.resources"]
    resources: ["nodepools/finalizers"]
    verbs: ["update", "patch"]
  - apiGroups: ["kai.resources"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["topology.node.k8s.io"]
    resources: ["noderesourcetopologies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "apps"]
    resources: ["deployments", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["scheduling.run.ai"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kai.scheduler"]
    resources: ["schedulingshards"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["kai.scheduler"]
    resources: ["topologies"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["grove.io"]
    resources: ["clustertopologybindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodepool-controller
  labels:
    {{- include "kai-resource-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodepool-controller
subjects:
  - kind: ServiceAccount
    name: nodepool-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
