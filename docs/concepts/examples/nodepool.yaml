# A node pool claiming every node labelled `nvidia.com/gpu.product=H100`.
#
# Prerequisites:
#   - KAI Resource Management installed.
#   - At least one node carrying that label. To label one for a trial:
#       kubectl label node <node> nvidia.com/gpu.product=H100
#
# Apply:
#   kubectl apply -f docs/concepts/examples/nodepool.yaml
#
# Then watch it claim its nodes:
#   kubectl get nodepool h100 -o wide
#   kubectl get nodepool h100 -o jsonpath='{.status.nodes}'
#
# The labelKey/labelValue pair is immutable after creation and must be unique
# across all node pools. Only the `default` node pool may leave both empty.
#
# Next: docs/concepts/examples/department.yaml
---
apiVersion: kai.resources/v1alpha1
kind: NodePool
metadata:
  name: h100
spec:
  labelKey: nvidia.com/gpu.product
  labelValue: H100
